primary_replication_unit: training_seed
paired_case_intervals: descriptive_conditional_on_checkpoint
secondary_outcomes:
  - parse_rate
  - accuracy_on_both_parsed
  - prompt_tokens
  - generated_tokens
  - elapsed_seconds
human_review: separate_pending_study
protocol_output: outputs/revision_v2/reasoning_confirmation/protocol.json
