study: independent_case_call_matched_reasoning_confirmation
dataset: CaseHOLD
source_split: test
sample_seed: 20261108
cases: 200
exclude:
  - frozen_training_test_1000_seed20261101
  - earlier_reasoning_60_seed41
checkpoint_groups: [base, fedavg_shared, flen_shared]
training_seeds: [41, 42, 43, 44, 45]
base_checkpoint_repetitions: 1
single_agent_calls: 4
