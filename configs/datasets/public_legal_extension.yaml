    raw_path: data/raw/public_extended/LegalBench/overruling/train.jsonl
    split: train
    text_fields: [text]
    label_field: label
    jurisdiction: us_common_law
    institution_id: court_us_legalbench
    institution_type: legal_research_institute
  - name: MultiEURLEX
    task: en-de
    raw_path: data/raw/public_extended/MultiEURLEX/en-de/train.jsonl
