raw_dir: data/raw/public_extended
processed_dir: data/processed/public_extended
partition_dir: data/partitions/public_extended
partition_strategy: institution_based
dirichlet_alpha: 0.3
seed: 42
tokenizer:
  name_or_path: null
  backend: simple
  max_length: 2048
  add_special_tokens: true
  save_text_tokens: false
datasets:
  - name: LeCaRDv2
    task: queries
    raw_path: data/raw/public_extended/LeCaRDv2/queries/queries.jsonl
    split: queries
    text_fields: [text]
    jurisdiction: chinese_criminal_law
    institution_id: court_cn_retrieval
    institution_type: court
  - name: LeCaRDv2
    task: corpus
    raw_path: data/raw/public_extended/LeCaRDv2/corpus/corpus.jsonl
    split: corpus
    text_fields: [title, text]
    jurisdiction: chinese_criminal_law
    institution_id: court_cn_retrieval
    institution_type: court
  - name: LegalBench
    task: citation_prediction_classification
    raw_path: data/raw/public_extended/LegalBench/citation_prediction_classification/train.jsonl
    split: train
    text_fields: [text]
    label_field: label
    citation_fields: [citation]
    jurisdiction: us_common_law
    institution_id: court_us_legalbench
    institution_type: legal_research_institute
  - name: LegalBench
    task: citation_prediction_open
    raw_path: data/raw/public_extended/LegalBench/citation_prediction_open/train.jsonl
    split: train
    text_fields: [text]
    label_field: label
    citation_fields: [citation]
    jurisdiction: us_common_law
    institution_id: court_us_legalbench
