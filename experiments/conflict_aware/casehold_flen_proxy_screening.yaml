experiment_id: E1_casehold_flen_proxy_screening
purpose: runtime and mechanism screening for target-conditioned aggregation
claim_scope: development_only
calibration_evidence_level: automatic_proxy_pilot
formal_legal_claims_allowed: false
methods: [target_cohort, flen]
model: Qwen/Qwen2.5-0.5B-Instruct
dataset: lex_glue/case_hold
seeds: [41, 42, 43]
num_clients: 4
num_rounds: 20
max_train_samples: 1200
max_eval_samples: 240
max_probe_samples: 24
partition_strategy: jurisdiction
target_jurisdiction: us_casehold_common_task
conflict:
  exposure: gold_error_gated_pairwise_verdict_disagreement
  penalty_lambda: 0.2
  diversity_floor: 0.1
  weight_smoothing: 0.5
  sample_count_cap: 1000
  cohort_policy: transferable_only
local_residual:
  target_cohort_steps: 0
  flen_shared_steps: 8
  flen_local_steps: 2
limitations:
  - CaseHOLD partitions are same-task non-IID clients, not authentic jurisdictions.
  - Automatic proxy calibration cannot validate legal conflict semantics.
  - Formal FLEN claims require expert-adjudicated calibration and independent conflict test sets.
